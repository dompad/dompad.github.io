<column class="flex-1 gap-20px padding-10px overflow-x-hidden">
    <box class="display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="1">
        <header>
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Image</text>
        </header>
        <column class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="1">
            <row class="justify-content-space-between">
                <text class="font-weight-bolder">Source</text>
                <flex class="font-size-13px gap-5px" data-tap="tool.box.file(event.target)">
                    <text class="border-1px-solid border-radius-50px color-777 padding-x-10px">Browse Files</text>
                </flex>
            </row>
            <column>
                <flex class="flex-1 gap-5px">
                    <input class="border-1px-solid border-color-777 border-radius-3px flex-1 height-30px padding-x-10px" name="src" oninput="tools.image.src(event.target)" type="text">
                </flex>
            </column>
        </column>
    </box>
    <box class="border-top-1px-solid border-color-777 display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="2">
        <header class="padding-top-20px">
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Size</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" data-element="focus" data-property="margin" tabindex="3">
            <text class="align-items-center display-flex font-weight-bolder gap-5px line-height-20px">
                <span>Height</span>
            </text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="height" oninput="tools.image.height(event.target)" type="text">
            </flex>
        </row>
        <row class="border-top-1px-solid border-color-ddd flex-1 gap-5px justify-content-space-between padding-y-10px" data-element="wrapper" data-property="padding" tabindex="3">
            <text class="align-items-center display-flex font-weight-bolder gap-5px line-height-20px">
                <span>Width</span>
            </text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="width" oninput="tools.image.width(event.target)" type="text">
            </flex>
        </row>
        <row class="border-top-1px-solid border-color-ddd flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="1">
            <text class="font-weight-bolder">Aspect Ratio</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="aspect-ratio" oninput="tools.image.aspectRatio(event.target)" type="text">
            </flex>
        </row>
    </box>
    <box class="border-top-1px-solid border-color-777 display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="4">
        <header class="padding-top-20px">
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Box Model</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="3">
            <text class="font-weight-bolder">Margin</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="margin" oninput="tools.image.margin(event.target)" type="text">
            </flex>
        </row>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="3">
            <text class="font-weight-bolder">Padding</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="padding" oninput="tools.image.padding(event.target)" type="text">
            </flex>
        </row>
    </box>
</column>
<row class="background-color-ccc">
    <box class="font-size-18px font-weight-bolder line-height-50px">
        <section>
            <text class="padding-x-10px">Image</text>
        </section>
    </box>
    <box class="margin-left-auto" data-tap="framework.tools.close()">
        <section>
            <ico>
                <n class="gg-check"></n>
            </ico>
        </section>
    </box>
</row>
