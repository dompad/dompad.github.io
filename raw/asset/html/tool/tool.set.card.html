<column class="flex-1 gap-20px padding-10px overflow-x-hidden">
    <box class="display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="5">
        <header class="padding-top-20px">
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Media</text>
        </header>
        <row class="gap-5px justify-content-space-between line-height-30px padding-y-10px" data-element="wrapper" data-property="media" tabindex="5">
            <text class="font-weight-bolder">Format</text>
            <row class="gap-5px" data-function="tool.function.media" data-declaration="array">
                <label class='align-items-center display-flex gap-5px justify-content-center' css-height="30px">
                    <input name="audio" onchange="tool.box.value(event)" type="checkbox">
                    <ico class="-checked-background-color-005cc8 -checked-border-color-005cc8 -checked-color-fff border-2px-solid border-color-ccc border-radius-5px box-sizing-border-box color-777 color-ddd" css-height="30px" css-width="30px">
                        <n class="--ggs-75pct gg-music"></n>
                    </ico>
                </label>
                <label class='align-items-center display-flex gap-5px justify-content-center' css-height="30px">
                    <input name="pages" onchange="tool.box.value(event)" type="checkbox">
                    <ico class="-checked-background-color-005cc8 -checked-border-color-005cc8 -checked-color-fff border-2px-solid border-color-ccc border-radius-5px box-sizing-border-box color-777 color-ddd" css-height="30px" css-width="30px">
                        <n class="--ggs-75pct gg-file-document"></n>
                    </ico>
                </label>
                <label class='align-items-center display-flex gap-5px justify-content-center' css-height="30px">
                    <input name="photo" onchange="tool.box.value(event)" type="checkbox">
                    <ico class="-checked-background-color-005cc8 -checked-border-color-005cc8 -checked-color-fff border-2px-solid border-color-ccc border-radius-5px box-sizing-border-box color-777 color-ddd" css-height="30px" css-width="30px">
                        <n class="--ggs-75pct gg-image"></n>
                    </ico>
                </label>
                <label class='align-items-center display-flex gap-5px justify-content-center' css-height="30px">
                    <input name="video" onchange="tool.box.value(event)" type="checkbox">
                    <ico class="-checked-background-color-005cc8 -checked-border-color-005cc8 -checked-color-fff border-2px-solid border-color-ccc border-radius-5px box-sizing-border-box color-777 color-ddd" css-height="30px" css-width="30px">
                        <n class="--ggs-75pct gg-film"></n>
                    </ico>
                </label>
                <label class='align-items-center display-flex gap-5px justify-content-center' css-height="30px">
                    <input name="merch" onchange="tool.box.value(event)" type="checkbox">
                    <ico class="-checked-background-color-005cc8 -checked-border-color-005cc8 -checked-color-fff border-2px-solid border-color-ccc border-radius-5px box-sizing-border-box color-777 color-ddd" css-height="30px" css-width="30px">
                        <n class="--ggs-75pct gg-shopping-bag"></n>
                    </ico>
                </label>
            </row>
        </row>
        <row class="border-top-1px-solid border-color-ddd display-none flex-1 gap-5px justify-content-space-between padding-y-10px" data-element="wrapper" data-property="limit" tabindex="3">
            <text class="font-weight-bolder">Limit</text>
            <field data-declaration="number">
                <ico class="opacity-25pct" css-height="20px" css-width="20px">
                    <n class="gg-math-minus"></n>
                </ico>
                <input class="border-1px-solid border-color-db border-radius-3px font-size-16px line-height-30px margin-x-5px padding-x-10px text-align-center width-20px" data-formula="repeat({var}, minmax(0, 1fr))" data-value="number" onchange="tool.box.value(event)" type="number" value="0">
                <ico css-height="20px" css-width="20px">
                    <n class="gg-math-plus"></n>
                </ico>
            </field>
        </row>
    </box>
    <box class="border-top-1px-solid border-color-777 display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="1">
        <header class="padding-top-20px">
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Background</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" data-element="node" data-property="background-color" tabindex="1">
            <text class="font-weight-bolder">Background Color</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-120px" name="background-color" oninput="tools.box.backgroundColor(event.target)" type="text">
            </flex>
        </row>
    </box>
    <box class="border-top-1px-solid border-color-777 display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="3">
        <header class="padding-top-20px">
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Size</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="1">
            <text class="font-weight-bolder">Height</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-120px" name="height" oninput="tools.box.height(event.target)" type="text">
            </flex>
        </row>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="2">
            <text class="font-weight-bolder">Width</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-120px" name="width" oninput="tools.box.width(event.target)" type="text">
            </flex>
        </row>
    </box>
    <box class="border-top-1px-solid border-color-777 display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="5">
        <header class="padding-top-20px">
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Layout</text>
        </header>
        <row class="gap-5px justify-content-space-between padding-y-10px" tabindex="3">
            <text class="font-weight-bolder">Display</text>
            <flex class="gap-5px">
                <field class="position-relative">
                    <row class="align-items-center border-1px-solid border-color-777 border-radius-3px gap-5px height-30px padding-x-5px min-width-120px" data-dropdown data-ignore>
                        <text class="flex-1 white-space-nowrap" name="display"></text>
                        <ico class="color-777" css-height="20px" css-width="20px">
                            <n class="gg-chevron-down"></n>
                        </ico>
                    </row>
                    <column class="-hd-width-100pct- background-color-fff border-radius-10px color-000 line-height-30px margin-auto padding-y-10px position-absolute right-0 white-space-nowrap width-auto" css-box-shadow="0 1px 6px rgb(32 33 36 / 28%)" css-display="none" data-hidden="tap" data-tap="tools.box.display(event.target)" css-top="100%">
                        <text class="-hover-background-color-eb height-30px padding-x-20px" data-value="">unset</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="none">none</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="flex">flex</text>
                    </column>
                </field>
            </flex>
        </row>
        <row class="border-top-1px-solid border-color-ddd flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="2">
            <text class="font-weight-bolder">Flex</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-120px" name="flex" oninput="tools.box.flex(event.target)" type="text">
            </flex>
        </row>
        <row class="border-top-1px-solid border-color-ddd gap-5px justify-content-space-between padding-y-10px" tabindex="2">
            <text class="font-weight-bolder">Flex Direction</text>
            <flex class="gap-5px">
                <field class="position-relative">
                    <row class="align-items-center border-1px-solid border-color-777 border-radius-3px gap-5px height-30px padding-x-5px min-width-120px" data-dropdown data-ignore>
                        <text class="flex-1 white-space-nowrap" name="flex-direction"></text>
                        <ico class="color-777" css-height="20px" css-width="20px">
                            <n class="gg-chevron-down"></n>
                        </ico>
                    </row>
                    <column class="-hd-width-100pct- background-color-fff border-radius-10px color-000 line-height-30px margin-auto padding-y-10px position-absolute right-0 white-space-nowrap width-auto" css-box-shadow="0 1px 6px rgb(32 33 36 / 28%)" css-display="none" data-hidden="tap" data-tap="tools.box.flexDirection(event.target)" css-top="100%">
                        <text class="-hover-background-color-eb padding-x-20px" data-value="">none</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="column">column</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="column-reverse">column-reverse</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="row">row</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="row-reverse">row-reverse</text>
                    </column>
                </field>
            </flex>
        </row>
        <row class="border-top-1px-solid border-color-ddd gap-5px justify-content-space-between padding-y-10px" tabindex="2">
            <text class="font-weight-bolder">Justify Content</text>
            <flex class="gap-5px">
                <field class="position-relative">
                    <row class="align-items-center border-1px-solid border-color-777 border-radius-3px gap-5px height-30px padding-x-5px min-width-120px" data-dropdown data-ignore>
                        <text class="flex-1 white-space-nowrap" name="justify-content"></text>
                        <ico class="color-777" css-height="20px" css-width="20px">
                            <n class="gg-chevron-down"></n>
                        </ico>
                    </row>
                    <column class="-hd-width-100pct- background-color-fff border-radius-10px color-000 line-height-30px margin-auto padding-y-10px position-absolute right-0 white-space-nowrap width-auto" css-box-shadow="0 1px 6px rgb(32 33 36 / 28%)" css-display="none" data-hidden="tap" data-tap="tools.box.justifyContent(event.target)" css-top="100%">
                        <text class="-hover-background-color-eb padding-x-20px" data-value="">none</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="center">center</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="flex-start">flex-start</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="flex-end">flex-end</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="space-around">space-around</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="space-between">space-between</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="space-evenly">space-evenly</text>
                        <text class="-hover-background-color-eb padding-x-20px" data-value="unset">unset</text>
                    </column>
                </field>
            </flex>
        </row>
        <row class="border-top-1px-solid border-color-ddd flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="4">
            <text class="font-weight-bolder">Gap</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-120px" name="gap" oninput="tools.box.gap(event.target)" type="text">
            </flex>
        </row>
    </box>
    <box class="border-top-1px-solid border-color-777 display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="6">
        <header class="padding-top-20px">
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Box Model</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="3">
            <text class="font-weight-bolder">Margin</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-120px" name="margin" oninput="tools.box.margin(event.target)" type="text">
            </flex>
        </row>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="3">
            <text class="font-weight-bolder">Padding</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-120px" name="padding" oninput="tools.box.padding(event.target)" type="text">
            </flex>
        </row>
    </box>
</column>
<row class="background-color-ccc">
    <box class="font-size-18px font-weight-bolder line-height-50px">
        <section>
            <text class="padding-x-10px">Card</text>
        </section>
    </box>
    <box class="margin-left-auto" data-tap="framework.tools.close()">
        <section>
            <ico>
                <n class="gg-check"></n>
            </ico>
        </section>
    </box>
</row>
