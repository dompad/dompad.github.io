<column class="flex-1 gap-20px padding-10px overflow-x-hidden">
    <box class="display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="1">
        <header>
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Size</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="1">
            <text class="font-weight-bolder">Height</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="height" oninput="tools.icon.height(event.target)" type="text">
            </flex>
        </row>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="2">
            <text class="font-weight-bolder">Width</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="width" oninput="tools.icon.width(event.target)" type="text">
            </flex>
        </row>
    </box>
    <box class="display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="2">
        <header>
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Box Model</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="3">
            <text class="font-weight-bolder">Margin</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="margin" oninput="tools.icon.margin(event.target)" type="text">
            </flex>
        </row>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" tabindex="3">
            <text class="font-weight-bolder">Padding</text>
            <flex class="gap-5px">
                <input class="border-1px-solid border-color-777 border-radius-3px height-30px padding-x-10px width-100px" name="padding" oninput="tools.icon.padding(event.target)" type="text">
            </flex>
        </row>
    </box>
    <box class="display-flex flex-direction-column justify-content-space-between line-height-30px" tabindex="2">
        <header>
            <text class="font-size-13px font-weight-bolder text-transform-uppercase">Icons</text>
        </header>
        <row class="flex-1 gap-5px justify-content-space-between padding-y-10px" css-columns="4" tabindex="3"></row>
        <template id="template-tools-icons">
            <flex css-align-items="center" css-aspect-ratio="1 / 1" css-justify-content="Center" css-outline="1px dashed gray">
                <ico></ico>
            </flex>
        </template>
    </box>
</column>
<row class="background-color-ccc">
    <box class="font-size-18px font-weight-bolder line-height-50px">
        <section>
            <text class="padding-x-10px">Icon</text>
        </section>
    </box>
    <box class="margin-left-auto" data-tap="framework.tools.close()">
        <section>
            <ico>
                <n class="gg-check"></n>
            </ico>
        </section>
    </box>
</row>
