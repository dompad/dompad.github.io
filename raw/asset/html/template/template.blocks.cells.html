<block class="align-items-center height-100pct justify-content-center width-100pct" css-background-color="rgba(0,0,0,0.5)" css-backdrop-filter="blur(10px)">
    <flex css-position="absolute" css-height="100%" css-width="100%" data-tap="modal.exit(event.target)"></flex>
    <flex class="margin-auto">
        <card class="background-color-fff border-radius-10px display-inline-flex flex-direction-column margin-auto overflow-hidden" css-box-shadow="0 1px 6px rgb(32 33 36 / 28%)" data-element="main">
            <column class="gap-10px overflow-x-hidden padding-20px">
                <box class="gap-20px">
                    <header>
                        <text class="font-weight-bolder line-height-30px">Elements</text>
                    </header>
                    <column class="gap-10px" css-columns="1" data-tap="tool.box.element(event.target)">
                        <text class="align-items-center display-flex gap-5px" data-value="link">
                            <ico css-height="30px" css-width="30px">
                                <n class="gg-link"></n>
                            </ico>
                            <span>Link</span>
                        </text>
                        <text class="align-items-center display-flex gap-5px" data-value="text">
                            <ico css-height="30px" css-width="30px">
                                <n class="gg-text"></n>
                            </ico>
                            <span>Text</span>
                        </text>
                        <text class="align-items-center display-flex gap-5px" data-value="icon">
                            <ico css-height="30px" css-width="30px">
                                <n class="gg-icon"></n>
                            </ico>
                            <span>Icon</span>
                        </text>
                        <text class="align-items-center display-flex gap-5px" data-value="media">
                            <ico css-height="30px" css-width="30px">
                                <n class="gg-feed"></n>
                            </ico>
                            <span>Media</span>
                        </text>
                        <text class="align-items-center display-flex gap-5px" data-value="image">
                            <ico css-height="30px" css-width="30px">
                                <n class="gg-image"></n>
                            </ico>
                            <span>Image</span>
                        </text>
                        <text class="align-items-center display-flex gap-5px" data-value="embedded">
                            <ico css-height="30px" css-width="30px">
                                <n class="gg-code-slash"></n>
                            </ico>
                            <span>Embed</span>
                        </text>
                    </column>
                </box>
            </column>
        </card>
    </flex>
</block>
