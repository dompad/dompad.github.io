<blocks>
    <header class="line-height-50px position-fixed top-0 width-100pct z-index-5" data-fetch="raw/asset/html/template/template.header.html"></header>
    <block>
        <picture class="background-color-ddd"></picture>
        <section>
            <card class="-mobile-margin-x-10px margin-x-4vw padding-top-160px padding-bottom-20px padding-top-160px">
                <column>
                    <box>
                        <section>
                            <text class="font-size-48px">Accounts</text>
                        </section>
                    </box>
                    <box>
                        <section>
                            <text class="font-size-18px">Your own repositories, followed by each organization you belong to.</text>
                        </section>
                    </box>
                </column>
            </card>
        </section>
    </block>
    <block class="-hd-margin-x-20px -isauth align-items-center justify-content-space-between z-index-1">
        <header class="-hd-max-width-480px align-items-center flex-grow-1 margin-auto max-width-768px padding-x-4vw width-100pct" css-width="calc(100% - 8vw)">
            <card>
                <row>
                    <box class="flex-1 justify-content-space-between line-height-50px">
                        <flex class="align-items-flex-start flex-1 flex-direction-column">
                            <text class="font-weight-bolder font-size-13px margin-right-auto overflow-hidden text-overflow-ellipsis white-space-nowrap">YOU</text>
                        </flex>
                    </box>                    
                </row>                
            </card>
        </header>
        <column class="width-100pct">            
            <card class="margin-bottom-1px margin-auto padding-y-10px width-100pct">
                <row class="-hd-max-width-480px align-items-center flex-grow-1 margin-auto max-width-768px padding-x-4vw width-100pct" css-width="calc(100% - 8vw)">
                    <box css-width="64px">
                        <row>
                            <picture class="background-color-000 border-radius-15pct overflow-hidden" css-height="64px" css-width="64px" >
                                <img>
                            </picture>
                        </row>
                    </box>
                    <box class="flex-1 justify-content-space-between" css-width="calc(100% - 84px)">
                        <flex class="align-items-flex-start flex-1 flex-direction-column">
                            <text class="font-weight-bolder margin-right-auto overflow-hidden padding-x-10px text-overflow-ellipsis white-space-nowrap" css-width="calc(100% - 40px)" placeholder="Account Owner"></text>
                            <text class="color-777 margin-right-auto overflow-hidden padding-x-10px text-overflow-ellipsis white-space-nowrap" css-width="calc(100% - 40px)" placeholder="Project Name">Personal Repositories</text>
                        </flex>
                    </box>
                    <box class="color-777 margin-left-auto" css-width="20px">
                        <row>
                            <ico css-height="20px" css-width="20px">
                                <n class="gg-chevron-right"></n>
                            </ico>
                        </row>
                    </box>
                </row>
            </card>
        </column>
        <header class="-hd-max-width-480px align-items-center flex-grow-1 margin-auto max-width-768px padding-x-4vw width-100pct" css-width="calc(100% - 8vw)">
            <card>
                <row>
                    <box class="flex-1 justify-content-space-between line-height-50px">
                        <flex class="align-items-flex-start flex-1 flex-direction-column">
                            <text class="font-weight-bolder font-size-13px margin-right-auto overflow-hidden text-overflow-ellipsis white-space-nowrap">ORGANIZATIONS</text>
                        </flex>
                    </box>                  
                </row>                
            </card>
        </header>
        <column class="width-100pct" id="feed-dashboard"></column>
        <column class="align-items-center empty-state gap-50px justify-content-center margin-y-50px">
            <card class="-hd-margin-x-20px margin-x-4vw">
                <column>
                    <box>
                        <column class="align-items-center justifiy-content-center">
                            <picture class="position-relative width-240px" data-max-width="calc(100% - 40px)">
                                <img class="width-100pct" src="raw/asset/png/astronaut-computer.png">
                            </picture>
                        </column>
                    </box>
                    <box>
                        <column>
                            <text class="font-size-24px font-weight-bolder line-height-50px text-align-center">No organizations yet</text>
                            <text class="font-size-18px text-align-center" data-dw960px-max-width="640px">Create or join an organiation in order to list it here.</text>
                        </column>
                    </box>
                </column>
            </card>
        </column>
    </block>
</blocks>

            </box>
            <box class="flex-1 justify-content-space-between" css-width="calc(100% - 84px)">
                <flex class="align-items-flex-start flex-1 flex-direction-column">

                    <text class="color-777 margin-right-auto overflow-hidden padding-x-10px text-overflow-ellipsis white-space-nowrap" css-width="calc(100% - 40px)">Organization</text>
                </flex>
            </box>
            <box class="color-777 margin-left-auto" css-width="20px">
                <row>
                    <ico css-height="20px" css-width="20px">

        </row>
    </card>
